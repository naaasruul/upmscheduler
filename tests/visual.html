<!doctype html>
<!-- Semakan visual: tests/visual.html?theme=comel&size=iphone-portrait  (servis dari root repo) -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Inter; src: url(../app/fonts/Inter.ttf); font-weight: 100 900; }
  @font-face { font-family: Sacramento; src: url(../app/fonts/Sacramento-Regular.ttf); }
  html, body { margin: 0; background: #888; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
  import { parseClassTimetable } from "../app/core/parse.js";
  import { buildModel } from "../app/core/model.js";
  import { render, canvasSize } from "../app/core/render.js";

  const q = new URLSearchParams(location.search);
  const [device, orientation] = (q.get("size") || "iphone-portrait").split("-");
  const html = await (await fetch("fixtures/kuliah.html")).text();
  const model = buildModel(parseClassTimetable(html).courses);
  if (q.has("clash")) model.items.push({ subject: 2, kind: "kuliah", day: 1, start: 540, end: 660, venue: "BK1" });
  await Promise.all([document.fonts.load('400 40px "Sacramento"'), document.fonts.load('800 40px "Inter"'), document.fonts.load('500 40px "Inter"')]);
  const c = document.getElementById("c");
  [c.width, c.height] = canvasSize(device, orientation);
  render(c.getContext("2d"), model, { theme: q.get("theme") || "comel", title: q.get("title") || "jadual kelas", footer: "Semester 1 2026/2027" });
  document.title = "done";
</script>
</body>
</html>
